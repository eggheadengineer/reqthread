name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install --quiet "PyYAML>=6" "jsonschema>=4.10"
      - run: PYTHONPATH=src python -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --quiet build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Smoke-test the wheel outside the source tree
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --quiet dist/*.whl
          cd /tmp
          /tmp/wheel-venv/bin/reqthread --version
          /tmp/wheel-venv/bin/reqthread validate --standard "$GITHUB_WORKSPACE/standards/iec61508-3.skeleton.yaml"

  traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: gate
        uses: ./ci/github
        with:
          config: examples/wb55-ref/reqthread.yaml
      - if: always()
        run: echo "gate status = ${{ steps.gate.outputs.status }}"
